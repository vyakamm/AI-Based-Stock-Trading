[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-stock-trading-strategy"
version = "1.0.0"
description = "Backtesting framework for deep learning based stock trading strategies (LSTM, Random Forest, XGBoost, SVM, KNN) with risk management."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vannick Yakam" }]
keywords = [
    "deep-learning",
    "trading",
    "backtesting",
    "lstm",
    "quantitative-finance",
    "algorithmic-trading",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<0.14",
    "joblib>=1.3,<2.0",
    "optuna>=3.6,<6.0",
]

[project.optional-dependencies]
tensorflow-cpu = ["tensorflow-cpu>=2.16,<3.0"]
tensorflow = ["tensorflow>=2.16,<3.0"]
xgboost = ["xgboost>=2.0,<3.0"]
yfinance = ["yfinance>=0.2.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
dl-trading = "dl_trading.cli:main"

[project.urls]
Homepage = "https://github.com/vyakamm/AI-Based-Stock-Trading"
Documentation = "https://github.com/vyakamm/AI-Based-Stock-Trading/tree/master/docs"
Issues = "https://github.com/vyakamm/AI-Based-Stock-Trading/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
